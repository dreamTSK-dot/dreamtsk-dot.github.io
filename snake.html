<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
:root{--bg:#0d1030;--panel:#161a42;--ink:#eef0ff;--muted:#a9aed4;--snake:#8b78ff;--head:#ffffff;--food:#ff6b4a;--grid:#1c2150;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;user-select:none;-webkit-user-select:none}
h1{margin:0;font-size:1.4rem;letter-spacing:-.01em}
.bar{display:flex;gap:24px;color:var(--muted);font-size:1rem}
.bar b{color:var(--ink);font-size:1.15rem}
.wrapc{position:relative;width:min(92vw,400px)}
canvas{width:100%;height:auto;aspect-ratio:1;display:block;background:var(--panel);border-radius:16px;touch-action:none}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(13,16,48,.82);border-radius:16px;padding:20px}
.msg.hide{display:none}
.msg p{margin:0;font-size:1.1rem}
button{font:inherit;cursor:pointer}
.go{background:var(--food);color:#1b0b07;font-weight:800;border:0;padding:12px 26px;border-radius:999px;font-size:1.05rem}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;margin-top:4px}
.pad button{background:var(--panel);color:var(--ink);border:1px solid var(--grid);border-radius:14px;font-size:1.4rem}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.go:focus-visible,.pad button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<a href="./" style="color:#a9aed4;text-decoration:none;font-size:.9rem;align-self:flex-start">← Retour aux jeux</a>
<h1>Snake</h1>
<div class="bar"><span>Score <b id="score">0</b></span><span>Record <b id="best">0</b></span></div>
<div class="wrapc">
  <canvas id="c" width="320" height="320"></canvas>
  <div class="msg" id="msg"><p id="mt">Glissez le doigt ou utilisez les flèches</p><button class="go" id="start">Jouer</button></div>
</div>
<div class="pad" aria-label="Commandes">
  <button class="u" data-d="u" aria-label="Haut">▲</button>
  <button class="l" data-d="l" aria-label="Gauche">◀</button>
  <button class="d" data-d="d" aria-label="Bas">▼</button>
  <button class="r" data-d="r" aria-label="Droite">▶</button>
</div>

<script>
var N = 16, S = 20;
var cv = document.getElementById("c"), cx = cv.getContext("2d");
var scoreEl = document.getElementById("score"), bestEl = document.getElementById("best");
var msg = document.getElementById("msg"), mt = document.getElementById("mt");
var snake, dir, next, food, score, timer, best = 0;

try { best = parseInt(localStorage.getItem("snake-best"), 10) || 0; } catch (e) {}
bestEl.textContent = best;

var V = { u:[0,-1], d:[0,1], l:[-1,0], r:[1,0] };

function placeFood(){
  do { food = { x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N) }; }
  while (snake.some(function(s){ return s.x === food.x && s.y === food.y; }));
}

function reset(){
  snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
  dir = V.r; next = V.r; score = 0; scoreEl.textContent = 0;
  placeFood();
}

function turn(k){
  var v = V[k];
  if (!v) return;
  if (v[0] === -dir[0] && v[1] === -dir[1]) return;
  next = v;
}

function draw(){
  cx.clearRect(0,0,320,320);
  cx.fillStyle = "#1c2150";
  for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) if ((i + j) % 2) cx.fillRect(i*S, j*S, S, S);
  cx.fillStyle = "#ff6b4a";
  cx.beginPath(); cx.arc(food.x*S + S/2, food.y*S + S/2, S/2 - 3, 0, 7); cx.fill();
  snake.forEach(function(s, i){
    cx.fillStyle = i === 0 ? "#ffffff" : "#8b78ff";
    cx.fillRect(s.x*S + 1, s.y*S + 1, S - 2, S - 2);
  });
}

function end(){
  clearInterval(timer); timer = null;
  if (score > best) {
    best = score; bestEl.textContent = best;
    try { localStorage.setItem("snake-best", best); } catch (e) {}
  }
  mt.textContent = "Perdu ! Score : " + score;
  document.getElementById("start").textContent = "Rejouer";
  msg.classList.remove("hide");
}

function step(){
  dir = next;
  var h = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(function(s){ return s.x === h.x && s.y === h.y; })) { end(); return; }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) { score++; scoreEl.textContent = score; placeFood(); }
  else snake.pop();
  draw();
}

function play(){
  reset(); draw(); msg.classList.add("hide");
  if (timer) clearInterval(timer);
  timer = setInterval(step, 130);
}

document.getElementById("start").addEventListener("click", play);
document.querySelectorAll(".pad button").forEach(function(b){
  b.addEventListener("click", function(){ turn(b.dataset.d); });
});
document.addEventListener("keydown", function(e){
  var m = { ArrowUp:"u", ArrowDown:"d", ArrowLeft:"l", ArrowRight:"r" }[e.key];
  if (m) { e.preventDefault(); turn(m); }
});

var sx, sy;
cv.addEventListener("touchstart", function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
cv.addEventListener("touchend", function(e){
  var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "r" : "l") : (dy > 0 ? "d" : "u"));
}, { passive: true });

reset(); draw();
</script>
</body>
</html>
